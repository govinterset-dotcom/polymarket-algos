<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Polymarket Algos — Comeback, Premove, Rozi</title>
  <meta name="description" content="Three research-driven Python strategies for BTC Up/Down markets on Polymarket with historical order-book replay and live CLOB execution." />
  <style>
    :root {
      --bg: #0b0f14;
      --card: #121821;
      --text: #e8eef7;
      --muted: #9aa8bc;
      --accent: #3b82f6;
      --border: #1e293b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #1a2740 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 640px;
      background: color-mix(in srgb, var(--card) 92%, transparent);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.55rem;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.55;
    }
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin: 20px 0 8px;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: white;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
    }
    a.btn:hover { filter: brightness(1.08); }
    .meta {
      margin-top: 22px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .meta a { color: #93c5fd; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Polymarket Algos</h1>
    <p>
      Three research-driven Python strategies for BTC Up/Down markets on Polymarket
      — Comeback, Premove and Rozi — with historical order-book replay, live CLOB execution,
      and documented performance.
    </p>

    <div class="badges">
      <a href="https://launchpoly.com/?ref=G9y17ypw6xODkmKzfE2h3iZewQNmsTCK" target="_blank" rel="noopener" data-launchpoly="G9y17ypw6xODkmKzfE2h3iZewQNmsTCK">
        <img src="https://launchpoly.com/api/badges/claim/G9y17ypw6xODkmKzfE2h3iZewQNmsTCK.svg?theme=light&size=medium"
             alt="Featured on LaunchPoly" width="150" height="44" />
      </a>
    </div>

    <p style="margin-top: 8px;">
      <a class="btn" href="https://github.com/govinterset-dotcom/polymarket-algos">View on GitHub →</a>
    </p>

    <div class="meta">
      Also listed on
      <a href="https://polymart.app">PolyMart</a>
      · Source & docs on
      <a href="https://github.com/govinterset-dotcom/polymarket-algos">GitHub</a>
    </div>
  </main>
</body>
</html>
